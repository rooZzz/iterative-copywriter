services:
  langflow:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - langflow_data:/app/langflow
      - ./components:/app/custom_components
    env_file:
      - .env
    environment:
      - LANGFLOW_COMPONENTS_PATH=/app/custom_components
      - LANGFLOW_DATABASE_URL=sqlite:////app/langflow/langflow.db
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true
      - LANGFLOW_SECRET_KEY=VkGdMcd6fMKClyVoCudhBXH4CuE_hcwDfedq3IvUoiM
      - PYTHONPATH=/app/custom_components/copywriting
    restart: unless-stopped

volumes:
  langflow_data:
