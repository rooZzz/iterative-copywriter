services:
  langflow:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - langflow_data:/app/langflow
      - ./components:/app/custom_components
    env_file:
      - .env
    environment:
      - LANGFLOW_COMPONENTS_PATH=/app/custom_components
      - LANGFLOW_AUTO_LOGIN=true
    restart: unless-stopped

volumes:
  langflow_data:
